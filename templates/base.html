<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Management System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-mark">E</div>
                <div>
                    <strong>EmployFlow</strong>
                    <span>Management Suite</span>
                </div>
            </div>

            <nav class="side-nav">
                <a href="{{ url_for('employee.home') }}" class="nav-item {% if request.endpoint == 'employee.home' %}active{% endif %}">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('employee.add_employee') }}" class="nav-item {% if request.endpoint == 'employee.add_employee' %}active{% endif %}">
                    <span class="nav-icon">＋</span>
                    <span>Add Employee</span>
                </a>
                <a href="/api/employees" class="nav-item">
                    <span class="nav-icon">⌘</span>
                    <span>API Endpoint</span>
                </a>
            </nav>

            <div class="sidebar-note">
                <span class="status-dot"></span>
                <div>
                    <strong>Flask API Online</strong>
                    <small>JWT protected • 1 hour</small>
                </div>
            </div>

            <a href="{{ url_for('auth.logout') }}" class="logout-link">
                <span>↪</span>
                Logout
            </a>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
                <div>
                    <span class="eyebrow">Employee Management System</span>
                    <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
                <div class="topbar-actions">
                    <div class="date-chip" id="currentDate"></div>
                    <div class="admin-chip">
                        <div class="admin-avatar">A</div>
                        <div>
                            <strong>Admin</strong>
                            <span>Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content-area">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
