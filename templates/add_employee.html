{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h1>Add Employee</h1>
    <form method="POST">
        <label>Employee ID</label>
        <input type="text" name="employee_id" placeholder="EMP001" required>

        <label>Name</label>
        <input type="text" name="name" placeholder="Employee Name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="employee@email.com" required>

        <label>Phone</label>
        <input type="text" name="phone" placeholder="9876543210" required>

        <label>Department</label>
        <select name="department" required>
            <option value="">Select Department</option>
            <option>IT</option>
            <option>HR</option>
            <option>Finance</option>
            <option>Sales</option>
            <option>Operations</option>
        </select>

        <label>Designation</label>
        <input type="text" name="designation" placeholder="Python Developer" required>

        <label>Salary</label>
        <input type="number" step="0.01" name="salary" placeholder="30000" required>

        <button class="button form-button" type="submit">Save Employee</button>
    </form>
</div>
{% endblock %}
