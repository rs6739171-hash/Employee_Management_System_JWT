{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h1>Edit Employee</h1>
    <form method="POST">
        <label>Employee ID</label>
        <input type="text" name="employee_id" value="{{ employee.employee_id }}" required>

        <label>Name</label>
        <input type="text" name="name" value="{{ employee.name }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ employee.email }}" required>

        <label>Phone</label>
        <input type="text" name="phone" value="{{ employee.phone }}" required>

        <label>Department</label>
        <select name="department" required>
            {% for department in ["IT", "HR", "Finance", "Sales", "Operations"] %}
            <option
                value="{{ department }}"
                {% if employee.department == department %}selected{% endif %}
            >{{ department }}</option>
            {% endfor %}
        </select>

        <label>Designation</label>
        <input type="text" name="designation" value="{{ employee.designation }}" required>

        <label>Salary</label>
        <input type="number" step="0.01" name="salary" value="{{ employee.salary }}" required>

        <button class="button form-button" type="submit">Update Employee</button>
    </form>
</div>
{% endblock %}
